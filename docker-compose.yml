# GENERATED by scripts/generate.py from teams.txt. Do not edit by hand.
name: telemetry-pipeline

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  ulimits: {core: 0}  # no core dumps: they would contain buffered locations

x-pipeline: &pipeline
  <<: *hardened
  image: telemetry-pipeline:local
  # provenance: false keeps the image id stable on Linux (see .build-stamp in the Makefile)
  build: {context: ., dockerfile: Dockerfile, provenance: false}
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

services:
  receiver:
    <<: *pipeline
    command: ["pipeline.receiver"]
    environment:
      RECEIVER_LISTEN: 0.0.0.0:7000
      RECEIVER_ALLOWED_IDS: team-a,team-b
      RECEIVER_DB: /data/telemetry.db
      TLS_CA: /certs/ca.crt
      TLS_CERT: /certs/tls.crt
      TLS_KEY: /certs/tls.key
    volumes:
      - ./certs/server:/certs:ro
      - ./data/receiver:/data
    networks: [tactical]  # no published port: reachable only through toxiproxy

  # Plays the internet between the instances and the tactical server.
  toxiproxy:
    <<: *hardened
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"  # API for the network scenarios, localhost only
    networks:
      wan: {aliases: [tactical-server]}
      tactical: {}
      control: {}

  agent-team-a:
    <<: *pipeline
    command: ["pipeline.agent"]
    mem_limit: 128m
    environment:
      AGENT_ID: team-a
      AGENT_LISTEN: 0.0.0.0:4600
      AGENT_SERVER: tactical-server:7001
      TLS_CA: /certs/ca.crt
      TLS_CERT: /certs/tls.crt
      TLS_KEY: /certs/tls.key
    volumes:
      - ./certs/team-a:/certs:ro
    networks: [gcs-team-a, wan]

  gcs-team-a:
    <<: *hardened
    image: telemetry-sim:local
    build: {context: gcs-sim, provenance: false}
    environment:
      SIM_TEAM_ID: team-a
      SIM_TARGET: agent-team-a:4600
    networks: [gcs-team-a]

  agent-team-b:
    <<: *pipeline
    command: ["pipeline.agent"]
    mem_limit: 128m
    environment:
      AGENT_ID: team-b
      AGENT_LISTEN: 0.0.0.0:4600
      AGENT_SERVER: tactical-server:7002
      TLS_CA: /certs/ca.crt
      TLS_CERT: /certs/tls.crt
      TLS_KEY: /certs/tls.key
    volumes:
      - ./certs/team-b:/certs:ro
    networks: [gcs-team-b, wan]

  gcs-team-b:
    <<: *hardened
    image: telemetry-sim:local
    build: {context: gcs-sim, provenance: false}
    environment:
      SIM_TEAM_ID: team-b
      SIM_TARGET: agent-team-b:4600
    networks: [gcs-team-b]

  rogue-impersonator:
    <<: *pipeline
    command: ["pipeline.agent"]
    profiles: [rogue]
    restart: "no"
    mem_limit: 128m
    environment:
      AGENT_ID: team-a
      AGENT_LISTEN: 0.0.0.0:4600
      AGENT_SERVER: tactical-server:7001
      TLS_CA: /certs/ca.crt
      TLS_CERT: /certs/tls.crt
      TLS_KEY: /certs/tls.key
    volumes:
      - ./certs/rogue-impersonator:/certs:ro
    networks: [wan]

  rogue-unlisted:
    <<: *pipeline
    command: ["pipeline.agent"]
    profiles: [rogue]
    restart: "no"
    mem_limit: 128m
    environment:
      AGENT_ID: team-unlisted
      AGENT_LISTEN: 0.0.0.0:4600
      AGENT_SERVER: tactical-server:7001
      TLS_CA: /certs/ca.crt
      TLS_CERT: /certs/tls.crt
      TLS_KEY: /certs/tls.key
    volumes:
      - ./certs/rogue-unlisted:/certs:ro
    networks: [wan]

networks:
  # Each team's LAN: only its GCS and its agent.
  gcs-team-a: {internal: true}
  gcs-team-b: {internal: true}
  wan: {internal: true}       # instances <-> toxiproxy
  tactical: {internal: true}  # toxiproxy <-> receiver
  control: {}                 # publishes the toxiproxy API to the host
